apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  generateName: single-gpu-torch-inline-
  namespace: bonete06
spec:
  queue: bonete06
  minAvailable: 1
  tasks:
    - name: worker
      replicas: 1
      template:
        metadata:
          labels:
            app: single-gpu-torch
        spec:
          schedulerName: volcano
          restartPolicy: Never
          tolerations:
            - key: "nvidia.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 8Gi
          containers:
            - name: worker
              image: nvcr.io/nvidia/pytorch:25.06-py3
              volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
              command: ["/bin/bash","-lc"]
              args:
                - |
                  set -e
                  echo "[gpu] one-time nvidia-smi then idle 1h"
                  nvidia-smi
                  sleep 36000
              resources:
                requests:
                  nvidia.com/gpu: "1"
                  cpu: "13"
                  memory: "351Gi"
                limits:
                  nvidia.com/gpu: "1"
                  cpu: "13"
                  memory: "351Gi"